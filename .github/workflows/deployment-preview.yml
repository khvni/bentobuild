name: Deployment Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  preview-deployment:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Add any required build-time environment variables here
          NODE_ENV: production

      - name: Comment PR with deployment info
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Deployment Preview Ready

              ✅ Build completed successfully

              ### Next Steps
              - Manual deployment to Vercel/Netlify/Daytona
              - Or set up automatic preview deployments

              **Commit:** ${context.sha.substring(0, 7)}
              **Branch:** ${context.ref}`
            })

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and analyze bundle
        run: |
          npm run build
          echo "## Bundle Size Report" > bundle-report.md
          echo "" >> bundle-report.md
          echo "Build output size:" >> bundle-report.md
          du -sh .next >> bundle-report.md
          echo "" >> bundle-report.md
          echo "Detailed breakdown:" >> bundle-report.md
          du -sh .next/* >> bundle-report.md || true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-report.md
